<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pencatatan Keuangan Pribadi</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./form2.css" />
    <style>
      .whitespace-pre-line {
        white-space: pre-line;
      }
      .bg-paper {
        transition: width 1s ease 0.5s;
      }
      .bg-paper:hover {
        box-shadow: 5px 5px 5px 5px rgba(78, 173, 79, 0.25);
      }
      .dark-mode-tambahan {
        background-blend-mode: soft-light;
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <section class="form-container">
        <form id="formulir" class="needs-validation" novalidate>
          <h1 class="text-center mb-4">Submit Data</h1>
          <div class="row g-4">
            <!-- Kiri -->
            <div class="col-md-6">
              <!-- Link Google Spreadsheet -->
              <div class="mb-3">
                <label for="link" class="form-label"
                  >Link Google Spreadsheet</label
                >
                <input
                  type="url"
                  name="link"
                  id="link"
                  class="form-control"
                  required
                  placeholder="Masukkan link Google Spreadsheet"
                  aria-describedby="linkHelp"
                />
                <div class="invalid-feedback">Masukkan link yang valid.</div>
              </div>

              <!-- Tanggal Transaksi -->
              <div class="mb-3">
                <label for="tanggal_transaksi" class="form-label"
                  >Tanggal Transaksi</label
                >
                <input
                  type="date"
                  name="tanggal_transaksi"
                  id="tanggal_transaksi"
                  class="form-control"
                  required
                />
                <div class="invalid-feedback">Masukkan tanggal transaksi.</div>
              </div>

              <!-- Keterangan -->
              <div class="mb-3">
                <label for="keterangan" class="form-label">Keterangan</label>
                <textarea
                  name="keterangan"
                  id="keterangan"
                  class="form-control"
                  rows="5"
                  required
                ></textarea>
                <div class="invalid-feedback">
                  Masukkan keterangan transaksi.
                </div>
              </div>

              <!-- Nominal -->
              <div class="mb-3">
                <label for="nominal" class="form-label">Nominal (Rp)</label>
                <input
                  type="number"
                  name="nominal"
                  id="nominal"
                  class="form-control"
                  required
                />
                <div id="display-nominal">Rp. 0,00</div>
                <div class="invalid-feedback">Masukkan nominal transaksi.</div>
              </div>
            </div>

            <!-- Kanan -->
            <div class="col-md-6">
              <!-- Jenis Keperluan -->
              <div class="mb-3">
                <label for="jenis_keperluan" class="form-label"
                  >Jenis Keperluan</label
                >
                <select
                  id="jenis_keperluan"
                  name="jenis_keperluan"
                  class="form-select"
                  required
                >
                  <option value="" disabled selected>
                    Pilih jenis keperluan
                  </option>
                  <option value="Pribadi">Pribadi</option>
                  <option value="Organisasi">Organisasi</option>
                  <option value="Sedekah">Sedekah</option>
                  <option value="Lainnya">Lainnya</option>
                </select>
                <div class="invalid-feedback">Pilih jenis keperluan.</div>
              </div>

              <!-- Tipe Pembayaran -->
              <div class="mb-3">
                <label for="tipe_pembayaran" class="form-label"
                  >Tipe Pembayaran</label
                >
                <select
                  id="tipe_pembayaran"
                  name="tipe_pembayaran"
                  class="form-select"
                  required
                >
                  <option value="" disabled selected>
                    Pilih tipe pembayaran
                  </option>
                  <option value="Tunai">Tunai</option>
                  <option value="LinkAja">LinkAja</option>
                  <option value="BSI">BSI</option>
                  <option value="Dana">Dana</option>
                </select>
                <div class="invalid-feedback">Pilih tipe pembayaran.</div>
              </div>

              <!-- Jenis Transaksi -->
              <div class="mb-3">
                <label for="jenis_transaksi" class="form-label"
                  >Jenis Transaksi</label
                >
                <div class="form-check">
                  <input
                    type="radio"
                    id="jenis_transaksi-pemasukan"
                    name="jenis_transaksi"
                    value="Pemasukan"
                    class="form-check-input"
                    required
                  />
                  <label
                    class="form-check-label"
                    for="jenis_transaksi-pemasukan"
                    >Pemasukan</label
                  >
                </div>
                <div class="form-check">
                  <input
                    type="radio"
                    id="jenis_transaksi-pengeluaran"
                    name="jenis_transaksi"
                    value="Pengeluaran"
                    class="form-check-input"
                    required
                  />
                  <label
                    class="form-check-label"
                    for="jenis_transaksi-pengeluaran"
                    >Pengeluaran</label
                  >
                </div>
                <div class="invalid-feedback">Pilih jenis transaksi.</div>
              </div>

              <!-- Catatan -->
              <div class="mb-3">
                <label for="catatan" class="form-label">Catatan</label>
                <textarea
                  name="catatan"
                  id="catatan"
                  class="form-control"
                  rows="5"
                  required
                ></textarea>
                <div class="invalid-feedback">Masukkan catatan transaksi.</div>
              </div>
            </div>
          </div>

          <!-- Hidden Inputs -->
          <input type="hidden" id="latitude" name="latitude" />
          <input type="hidden" id="longitude" name="longitude" />

          <!-- Submit -->
          <div class="text-center">
            <button type="submit" class="btn btn-outline-primary">
              Submit
            </button>
            <p class="mt-3 mb-1 text-muted" style="font-size: 14px">
              Ucapkan Basmallah sebelum melakukan submit
            </p>
          </div>
        </form>
      </section>
    </div>
    <!-- container -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      let spsUrl = "";
      const formulir = document.getElementById("formulir");
      setInterval(updateCurrentTime, 1000);

      function updateCurrentTime() {
        const options = {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "numeric",
          minute: "numeric",
          second: "numeric",
          timeZoneName: "short",
        };
        const currentTime = new Date().toLocaleString("id-ID", options);

        document.getElementById("current-time").textContent = currentTime;
      }

      function updateLocation() {
        if (navigator.geolocation) {
          console.log("coba" + navigator.geolocation);
          navigator.geolocation.getCurrentPosition(
            (position) => {
              const { latitude, longitude } = position.coords;
              document.getElementById(
                "current-location"
              ).textContent = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
              document.getElementById("latitude").value = latitude;
              document.getElementById("longitude").value = longitude;
            },
            (error) => {
              console.info("Error:", error);
              document.getElementById("current-location").textContent =
                "Not available";
            }
          );
        } else {
          document.getElementById("current-location").textContent =
            "Not supported";
        }
      }
      // Load cached data
      window.addEventListener("load", () => {
        if (
          document.documentElement.getAttribute("data-bs-theme") == "dark" ||
          localStorage.getItem("dark-mode") == "true" ||
          localStorage.getItem("theme") == "dark"
        ) {
          document.querySelectorAll(".bg-paper").forEach((element) => {
            element.classList.add("dark-mode-tambahan");
          });
        }
        updateLocation();

        const cachedData = localStorage.getItem("formData");
        console.log(cachedData);
        if (cachedData) {
          const data = JSON.parse(cachedData);
          Object.entries(data).forEach(([key, value]) => {
            const element = formulir.elements[key];
            if (element) {
              if (element.type === "checkbox") {
                element.checked = value.includes(element.value);
              } else if (element.type === "radio") {
                element.checked = element.value === value;
              } else if (element.type !== "file") {
                element.value = value;
              }
            }
          });
        }
        defaultTanggalTransaksi();
        resetNominal();
      });

      function defaultTanggalTransaksi() {
        let today = new Date();
        const dd = String(today.getDate()).padStart(2, "0");
        const mm = String(today.getMonth() + 1).padStart(2, "0"); //January is 0!
        const yyyy = today.getFullYear();

        today = yyyy + "-" + mm + "-" + dd;
        document.getElementById("tanggal_transaksi").value = today;
      }

      formulir.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (formulir.checkValidity()) {
          changeSubmitToLoading();
          bePatient();
          const formData = new FormData(formulir);
          const data = Object.fromEntries(formData);
          spsUrl = formData.get("link");
          localStorage.setItem("formData", JSON.stringify(data));
          data.interests = formData.getAll("interests");
          const { row } = await sendToSpreadsheet(data);
          if (row) {
            showSuccessSendForm(row);
          } else {
            alert("Gagal mengirimkan formulir");
            location.reload(true);
          }
        } else {
          formulir.classList.add("was-validated");
        }
      });
      function resetNominal() {
        document.getElementById("nominal").value = 0;
        document.getElementById("display-nominal").textContent = "Rp. 0,00";
      }
      function changeSubmitToLoading() {
        const submitButton = document.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.classList.add("disabled");
        submitButton.className = "btn mb-sm-3 btn-primary loading-button";
        submitButton.innerHTML = `
  <span class="spinner-grow spinner-grow-sm" aria-hidden="true"></span>
  <span role="status">Tunggu Yaa...</span>
        `;
      }
      function bePatient() {
        document.getElementById("pesan").textContent =
          "“Dan bersabarlah! Sesungguhnya Allah beserta orang-orang yang sabar.” (QS. Al-Anfal:46)";
      }

      function showSuccessSendForm(lastrow) {
        formulir.innerHTML = `
        <div class="card mb-3 p-sm-3 bg-paper">
                            <div class="card-body">

            <div class="text-center">
                <h1 class="display-4 text-success">Alhamdulillah</h1>
                <p class="lead">Data Anda berhasil tersimpan pada baris ke - ${lastrow}</p>
                <div class="mt-4">
 <a class="btn btn-danger" onclick="tutupWindow()">Tutup</a>
                    <a class="btn btn-primary" href="${spsUrl}" target="_blank">Lihat Data</a>

                </div>
            </div>
            </div>
        </div>
        `;
      }
      function tutupWindow() {
        try {
          return window.close();
        } catch (e) {
          alert("Maaf, ada  kesalahan saat menutup window\n" + e.message);
        }
      }
      // // nominal on input
      document.getElementById("nominal").addEventListener("input", (event) => {
        const nominal = event.target.value;
        document.getElementById("display-nominal").textContent =
          formatRupiah(nominal);
      });
      // format rupiah function (Rp. xxx.xxx.xxx)
      function formatRupiah(nominal) {
        const formatter = new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          minimumFractionDigits: 2,
        });
        return formatter.format(nominal);
      }

      async function sendToSpreadsheet(data) {
        try {
          const response = await fetch(
            "https://script.google.com/macros/s/AKfycbyaQBwP0FCLjVtOhC8bhMzAsJ_pBEIr6_CK7GkOA4looYCxcxZ0EUQIWzEf7cwtzm1h7A/exec?query=pencatatan",
            {
              method: "POST",
              redirect: "follow",

              headers: {
                "Content-Type": "text/plain",
              },

              body: JSON.stringify(data),
            }
          );
          console.log("aaw");
          if (response.ok) {
            const result = await response.json();
            localStorage.setItem("formData", JSON.stringify(data));
            return result;
          } else {
            throw new Error("Form submission failed");
          }
        } catch (error) {
          console.error("Error:", error);
        } finally {
        }
      }

      function changeTheme() {
        const theme = document.documentElement.getAttribute("data-bs-theme");
        if (theme === "dark") {
          document.documentElement.setAttribute("data-bs-theme", "light");
        } else {
          document.querySelectorAll(".bg-paper").forEach((element) => {
            element.classList.add("dark-mode-tambahan");
          });
          document.documentElement.setAttribute("data-bs-theme", "dark");
        }
      }
    </script>
  </body>
</html>
